# 이 workflow는 "서버 배포"까지는 하지 않고
# GitHub Actions에서 MSA 저장소 안의 서비스 이미지를 만들어 GHCR까지 올리는 역할만 담당한다.
# 현재 이 저장소 기준 대상은 config, discovery, apigateway 세 모듈이다.
name: image-registry-cicd

on:
  # GitHub Actions 화면에서 버튼으로 직접 실행할 수 있게 한다.
  workflow_dispatch:
  push:
    # main-apigateway 브랜치에 코드가 들어올 때 자동으로 동작한다.
    branches:
      - main-apigateway
    # 아래 경로가 바뀐 경우에만 실행해서 불필요한 빌드를 줄인다.
    paths:
      - "config/**"
      - "discovery/**"
      - "apigateway/**"
      - ".github/workflows/image-registry-cicd.yml"

concurrency:
  # 같은 workflow가 연속으로 실행되면 이전 작업을 취소하고
  # 가장 최신 코드 기준 실행만 남기도록 한다.
  group: image-registry-cicd
  cancel-in-progress: true

permissions:
  # 저장소 코드를 checkout 하려면 읽기 권한이 필요하다.
  contents: read
  # GHCR에 이미지를 push 하려면 packages 쓰기 권한이 필요하다.
  packages: write

jobs:
  build-and-push:
    name: "${{ matrix.module_name }} 이미지 빌드 및 푸시"
    runs-on: ubuntu-latest
    strategy:
      # 한 서비스가 실패해도 다른 서비스 빌드는 계속 진행하게 한다.
      fail-fast: false
      matrix:
        include:
          - module_name: config
            module_dir: config
            image_name: config
          - module_name: discovery
            module_dir: discovery
            image_name: discovery
          - module_name: apigateway
            module_dir: apigateway
            image_name: apigateway

    steps:
      # 현재 저장소 코드를 runner로 내려받는다.
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      # JDK 17 준비 + Gradle 캐시로 빌드 속도 향상
      - name: JDK 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # GHCR 경로는 소문자 저장소명이 가장 안전하므로 owner 값을 한 번 정리한다.
      # IMAGE_TAG는 현재 커밋 SHA 앞 7자리로 두어서 어떤 코드에서 만들어진 이미지인지 추적하기 쉽게 만든다.
      - name: 이미지 경로 값 준비
        shell: bash
        run: |
          echo "IMAGE_REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "${GITHUB_ENV}"
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "${GITHUB_ENV}"

      # 발급한 CICID_SECRET 토큰으로 GHCR 로그인
      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CICID_SECRET }}

      # 각 모듈 폴더로 이동해서 스크립트로 jar 빌드 → Docker 이미지 빌드 → GHCR push
      - name: 이미지 빌드 및 푸시
        shell: bash
        working-directory: ${{ matrix.module_dir }}
        env:
          IMAGE_REGISTRY: ${{ env.IMAGE_REGISTRY }}
          IMAGE_NAME: ${{ matrix.image_name }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          PUSH_IMAGE: "true"
          LOAD_TO_MINIKUBE: "false"
        run: |
          ./scripts/build_jar.sh
          ./scripts/build_docker.sh

      # Actions 화면에서 어떤 이미지가 올라갔는지 확인용 출력
      - name: 결과 출력
        shell: bash
        run: |
          echo "완료 이미지: ${{ env.IMAGE_REGISTRY }}/${{ matrix.image_name }}:${{ env.IMAGE_TAG }}"